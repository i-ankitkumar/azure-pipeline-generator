[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azpipegen"
version = "0.1.0"
description = "Turn a plain-English CI/CD description into a working Azure Pipelines YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankit Kumar" }]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.30"]
dev = ["pytest>=7.0"]

[project.scripts]
azpipegen = "azpipegen.cli:main"

[tool.setuptools.packages.find]
include = ["azpipegen*"]
