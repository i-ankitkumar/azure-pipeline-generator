name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -v
      - name: Self-check — generate a sample pipeline
        run: |
          azpipegen "Build a Python 3.11 app, run pytest, then deploy to an Azure Web App called demo-app on push to main" -o /tmp/sample-pipeline.yml
          cat /tmp/sample-pipeline.yml
